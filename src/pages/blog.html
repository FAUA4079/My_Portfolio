<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{META}}
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/blog.css">
    <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
    {{NAV}}

    <main id="main-content" tabindex="-1" class="main-wrapper">
        <header class="page-header">
            <h1>Security &amp; Code Writeups</h1>
            <p>Chronological logs of pentest findings, CTF walkthroughs, and programming insights.</p>
        </header>
        <div class="filter-bar" id="filterBar">
            <div id="tagFilters" role="group" aria-label="Filter articles by tag"></div>
            <div class="sort-toggle">
                <button type="button" class="filter-btn active" id="sortToggle">↓ Newest First</button>
            </div>
        </div>
        <div class="blog-container" id="blogContainer" aria-live="polite">{{BLOGS}}</div>
        <noscript><p>All articles are listed above. You can also <a href="https://medium.com/@fuadh6565">read all writeups on Medium</a>.</p></noscript>
        <div class="pagination" id="paginationControls" aria-label="Article pages">
            <button type="button" class="page-btn" id="prevBtn">← Prev</button>
            <span class="page-indicator" id="pageIndicator" aria-live="polite">Page 1 of 1</span>
            <button type="button" class="page-btn" id="nextBtn">Next →</button>
        </div>
    </main>
    {{FOOTER}}

    
<script src="assets/js/site.js" defer></script>
<script src="assets/js/blog-data.js" defer></script>
<script src="assets/js/blog.js" defer></script>
</body>
</html>
