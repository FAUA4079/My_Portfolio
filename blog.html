<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toreno79|Blog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-brand">:> Toreno79_</a>
            <button class="nav-toggle" onclick="document.querySelector('.navbar-links').classList.toggle('open')"
                aria-label="Toggle navigation">☰</button>
            <div class="navbar-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="education.html">Education</a>
                <a href="achievements.html">Achievements</a>
                <a href="experience.html">Experience</a>
                <a href="projects.html">Projects</a>
                <a href="blog.html" class="active">Blog</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-wrapper">

        <header class="page-header">
            <h1>Writeups</h1>
            <p>Chronological logs of pentest findings, CTF walkthroughs, and programming insights.</p>
        </header>

        <!-- Tag Filtering Bar -->
        <div class="filter-bar" id="filterBar">
<button class="filter-btn active" data-tag="all">All Tags</button>
            <button class="filter-btn" data-tag="THM">THM</button>
            <button class="filter-btn" data-tag="WiFi">WiFi</button>
            <button class="filter-btn" data-tag="Bash scripting">Bash scripting</button>
            <button class="filter-btn" data-tag="Password cracking">Password cracking</button>
            <button class="filter-btn" data-tag="Writeup">Writeup</button>
            <div class="sort-toggle">
                <button class="filter-btn active" id="sortToggle" onclick="toggleSort()">↓ Newest First</button>
            </div>
        </div>

        <!-- Blog Container (Top to Bottom - Old to New) -->
        <div class="blog-container" id="blogContainer">
            <!-- Dynamically populated via JavaScript -->
        </div>

        <!-- Pagination Controls -->
        <div class="pagination" id="paginationControls">
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">← Prev</button>
            <span class="page-indicator" id="pageIndicator">Page 1 of 1</span>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">Next →</button>
        </div>

    </div>

    <!-- Modal Popup -->
    <div class="modal-overlay" id="blogModal">
        <div class="modal-content">
            <h3 class="modal-title" id="modalTitle">Blog Title</h3>
            <div class="modal-details" id="modalDetails">Detailed breakdown and insights of the blog post go here...
            </div>
            <div class="modal-actions">
                <button class="modal-close" onclick="closeModal()">Close</button>
                <a href="#" id="modalLink" class="btn" target="_blank" rel="noopener noreferrer">Read Full Article</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
<footer class="footer">
        <p>&copy; 2026 Toreno79</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // All blogs data ordered from Old to New (chronological order)
        const blogs = [
            {
                id: 1,
                title: "WAP/WAP2 Hacking-Basic",
                tags: ["WiFi"],
                date: "2025-05-25",
                details: "Some basic WiFi hacking techniques and penetration testing methods for WAP/WAP2 networks. Covers common vulnerabilities, password cracking, and security best practices.",
                link: "https://medium.com/@fuadh6565/wap-wap2-hacking-basic-56dc59e1fdaf?sharedUserId=fuadh6565"
            },
            {
                id: 2,
                title: "Bash Scripting - Tryhackme",
                tags: ["THM", "Bash scripting", "Writeup"],
                date: "2025-06-08",
                details: "A comprehensive writeup on Bash scripting room encountered on TryHackMe. Explains command-line techniques, script automation, and practical applications in penetration testing scenarios.",
                link: "https://medium.com/@fuadh6565/bash-scripting-tryhackme-42c3a0cdbddb?sharedUserId=fuadh6565"
            },
            {
                id: 3,
                title: "Password Cracking — TryHackMe",
                tags: ["Password cracking", "THM", "Writeup"],
                date: "2026-07-19",
                details: "A detailed writeup on password cracking techniques explored in a TryHackMe room. Covers hash types, cracking tools, and methodologies for ethical hacking and security testing.",
                link: "https://medium.com/@fuadh6565/password-cracking-tryhackme-7ec5434ea9bc?sharedUserId=fuadh6565"
            }
        ];

        let currentPage = 1;
        const blogsPerPage = 5;
        let currentTag = 'all';
        let sortAscending = false; // Default: Newest First (descending)

        // ===== URL HELPERS =====
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function getHashParam() {
            const hash = window.location.hash.slice(1);
            if (hash.startsWith('post-')) return parseInt(hash.split('-')[1]);
            return null;
        }

        function setQueryParams() {
            const params = new URLSearchParams();
            if (currentTag !== 'all') params.set('tag', currentTag);
            if (currentPage > 1) params.set('page', currentPage);
            if (sortAscending) params.set('sort', 'asc');
            const qs = params.toString();
            const newUrl = qs ? window.location.pathname + '?' + qs : window.location.pathname;
            history.pushState(null, '', newUrl);
        }

        function setHash(value) {
            if (value) {
                // Preserve query params when setting hash
                const qs = window.location.search;
                history.pushState(null, '', qs ? window.location.pathname + qs + '#' + value : window.location.pathname + '#' + value);
            } else {
                // Clear hash, preserve query params
                const qs = window.location.search;
                history.pushState(null, '', qs ? window.location.pathname + qs : window.location.pathname);
            }
        }

        // ===== INIT STATE FROM URL =====
        function initFromUrl() {
            const tagParam = getQueryParam('tag');
            if (tagParam) {
                currentTag = tagParam;
                // Activate the corresponding filter button
                document.querySelectorAll('.filter-bar .filter-btn:not(#sortToggle)').forEach(b => {
                    b.classList.toggle('active', b.getAttribute('data-tag') === tagParam);
                });
            }

            const pageParam = getQueryParam('page');
            if (pageParam) currentPage = parseInt(pageParam) || 1;

            const sortParam = getQueryParam('sort');
            if (sortParam === 'asc') {
                sortAscending = true;
                document.getElementById('sortToggle').textContent = '↑ Oldest First';
            }

            const postId = getHashParam();
            if (postId) {
                setTimeout(() => openModal(postId), 100);
            }
        }

        // Filter blogs based on tag
        function getFilteredBlogs() {
            let filtered;
            if (currentTag === 'all') {
                filtered = [...blogs];
            } else {
                filtered = blogs.filter(b => b.tags && b.tags.includes(currentTag));
            }
            // Sort by date
            filtered.sort((a, b) => {
                const dateA = new Date(a.date);
                const dateB = new Date(b.date);
                return sortAscending ? dateA - dateB : dateB - dateA;
            });
            return filtered;
        }

        // Toggle sort order
        function toggleSort() {
            sortAscending = !sortAscending;
            const btn = document.getElementById('sortToggle');
            btn.textContent = sortAscending ? '↑ Oldest First' : '↓ Newest First';
            currentPage = 1;
            renderBlogs();
            setQueryParams();
        }

        // Render blogs for current page
        function renderBlogs() {
            const filtered = getFilteredBlogs();
            const totalPages = Math.ceil(filtered.length / blogsPerPage) || 1;

            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * blogsPerPage;
            const end = start + blogsPerPage;
            const paginatedBlogs = filtered.slice(start, end);

            const container = document.getElementById('blogContainer');
            container.innerHTML = '';

            if (paginatedBlogs.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-dim); padding: 40px 0;">No logs found for this tag.</p>`;
            } else {
                paginatedBlogs.forEach(blog => {
                    const row = document.createElement('div');
                    row.className = 'blog-row animate-fade-in';
                    row.innerHTML = `
                        <div class="blog-info">
                            <span class="blog-title">${blog.title}</span>
<div class="blog-meta">
                                ${blog.tags.map(t => `<span class="blog-tag-badge">${t}</span>`).join('')}
                                <span>📅 ${blog.date}</span>
                            </div>
                        </div>
                        <button class="btn" onclick="openModal(${blog.id})">▶ Read</button>
                    `;
                    container.appendChild(row);
                });
            }

            // Update pagination UI
            document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages || totalPages === 0;

            // Update URL query params
            setQueryParams();
        }

        // Pagination control
        function changePage(direction) {
            currentPage += direction;
            renderBlogs();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Tag filter buttons setup (exclude sort toggle)
        document.querySelectorAll('.filter-bar .filter-btn:not(#sortToggle)').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-bar .filter-btn:not(#sortToggle)').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentTag = e.target.getAttribute('data-tag');
                currentPage = 1;
                renderBlogs();
            });
        });

        // Modal Pop-up Handlers
        function openModal(id) {
            const blog = blogs.find(b => b.id === id);
            if (!blog) return;

            document.getElementById('modalTitle').innerText = blog.title;
            document.getElementById('modalDetails').innerText = blog.details;
            document.getElementById('modalLink').href = blog.link;

            document.getElementById('blogModal').classList.add('open');
            document.body.style.overflow = 'hidden';

            // Set URL hash
            setHash('post-' + id);
        }

        function closeModal() {
            document.getElementById('blogModal').classList.remove('open');
            document.body.style.overflow = 'auto';
            // Clear hash (restore query params)
            setHash(null);
        }

        // Close modal on background click
        document.getElementById('blogModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('blogModal')) {
                closeModal();
            }
        });

        // Close modal with Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && document.getElementById('blogModal').classList.contains('open')) {
                closeModal();
            }
        });

        // Handle browser back/forward
        window.addEventListener('popstate', function() {
            // Close modal if open
            if (document.getElementById('blogModal').classList.contains('open')) {
                document.getElementById('blogModal').classList.remove('open');
                document.body.style.overflow = 'auto';
            }
            // Re-init from URL
            initFromUrl();
            renderBlogs();
        });

        // Close mobile nav when a link is clicked
        document.querySelectorAll('.navbar-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelector('.navbar-links').classList.remove('open');
            });
        });

        // Initial render with URL params
        initFromUrl();
        renderBlogs();
    </script>
</body>

</html>
