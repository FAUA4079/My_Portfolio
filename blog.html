<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toreno79 | Blog</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additions to your existing stylesheet. */
        .filter-bar { flex-wrap: wrap; gap: 8px; }
        #tagFilters { display: flex; flex-wrap: wrap; gap: 8px; }
        .blog-title-line { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
        .blog-row.is-latest { border-left: 3px solid var(--green, #4ade80); background: rgba(74, 222, 128, .06); }
        .blog-new-badge { display: inline-block; background: var(--green, #4ade80); color: #082012; border-radius: 4px; padding: 3px 8px; font-size: .7rem; font-weight: 800; letter-spacing: .08em; line-height: 1.4; white-space: nowrap; }
        .blog-read-link { white-space: nowrap; text-decoration: none; }
        .blog-info { min-width: 0; }
        .blog-title { overflow-wrap: anywhere; }
        .blog-meta { flex-wrap: wrap; }
        .blog-read-link:focus-visible, .filter-btn:focus-visible, .page-btn:focus-visible { outline: 2px solid var(--green, #4ade80); outline-offset: 4px; }
        @media (max-width: 600px) {
            .blog-row { flex-direction: column; align-items: flex-start; gap: 14px; }
            .sort-toggle { margin-left: 0; }
        }
    </style>
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-brand">:&gt; Toreno79_</a>
            <button class="nav-toggle" type="button" id="navToggle" aria-label="Toggle navigation" aria-controls="navbarLinks" aria-expanded="false">☰</button>
            <div class="navbar-links" id="navbarLinks">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="education.html">Education</a>
                <a href="achievements.html">Achievements</a>
                <a href="experience.html">Experience</a>
                <a href="projects.html">Projects</a>
                <a href="blog.html" class="active" aria-current="page">Blog</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <main class="main-wrapper">
        <header class="page-header">
            <h1>Security &amp; Code Writeups</h1>
            <p>Chronological logs of pentest findings, CTF walkthroughs, and programming insights.</p>
        </header>
        <div class="filter-bar" id="filterBar">
            <div id="tagFilters" role="group" aria-label="Filter articles by tag"></div>
            <div class="sort-toggle">
                <button type="button" class="filter-btn active" id="sortToggle">↓ Newest First</button>
            </div>
        </div>
        <div class="blog-container" id="blogContainer" aria-live="polite"></div>
        <noscript><p>Enable JavaScript to filter the articles, or <a href="https://medium.com/@fuadh6565">read all writeups on Medium</a>.</p></noscript>
        <div class="pagination" id="paginationControls" aria-label="Article pages">
            <button type="button" class="page-btn" id="prevBtn">← Prev</button>
            <span class="page-indicator" id="pageIndicator" aria-live="polite">Page 1 of 1</span>
            <button type="button" class="page-btn" id="nextBtn">Next →</button>
        </div>
    </main>
    <footer class="footer"><p>&copy; 2026 Toreno79</p></footer>

    <script>
        // ADD FUTURE ARTICLES HERE. Use a unique id and the publication date.
        // Array order does not matter. Tags and the latest-post badge are automatic.
        // Dates: YYYY-MM-DD (or a full ISO timestamp to distinguish same-day posts).
        // For identical dates, the larger id wins the NEW badge.
        // This is a manually maintained list, not an automatic Medium feed import.
        const blogs = [
            {
                id: 1,
                title: "WAP/WAP2 Hacking-Basic",
                tags: ["WiFi"],
                date: "2025-05-30",
                link: "https://medium.com/@fuadh6565/wap-wap2-hacking-basic-56dc59e1fdaf"
            },
            {
                id: 2,
                title: "Bash Scripting — Tryhackme",
                tags: ["THM", "Bash scripting", "Writeup"],
                date: "2025-06-08",
                link: "https://medium.com/@fuadh6565/bash-scripting-tryhackme-42c3a0cdbddb"
            },
            {
                id: 3,
                title: "Password Cracking — TryHackMe",
                tags: ["Password cracking", "THM", "Writeup"],
                date: "2026-07-19",
                link: "https://medium.com/@fuadh6565/password-cracking-tryhackme-7ec5434ea9bc"
            },
            {
                id: 4,
                title: "JWT Security — TryHackMe",
                tags: ["THM", "JWT", "Writeup"],
                date: "2026-07-25",
                link: "https://medium.com/@fuadh6565/jwt-security-tryhackme-9b5133c25b03"
            },
            {
                id: 5,
                title: "Local Authority — picoCTF",
                tags: ["picoCTF", "Writeup"],
                date: "2026-09-05",
                link: "https://medium.com/@fuadh6565/local-authority-picoctf-d4f8b150ddff"
            },
            {
                id: 6,
                title: "User ID controlled by request parameter — PortSwigger",
                tags: ["PortSwigger", "Access control", "Writeup"],
                date: "2026-09-05",
                link: "https://medium.com/@fuadh6565/user-id-controlled-by-request-parameter-portswigger-da08a74f508c"
            },
            {
                id: 7,
                title: "SSTI1 — picoCTF",
                tags: ["picoCTF", "SSTI", "Writeup"],
                date: "2026-09-06",
                link: "https://medium.com/@fuadh6565/ssti1-picoctf-589b4eeb3e26"
            },
            {
                id: 8,
                title: "User role can be modified in user profile — PortSwigger",
                tags: ["PortSwigger", "Access control", "Writeup"],
                date: "2026-09-06",
                link: "https://medium.com/@fuadh6565/user-role-can-be-modified-in-user-profile-portswigger-2595ebf5abb1"
            },
            {
                id: 9,
                title: "JWT authentication bypass via unverified signature — PortSwigger",
                tags: ["PortSwigger", "JWT", "Writeup"],
                date: "2026-09-08",
                link: "https://medium.com/@fuadh6565/jwt-authentication-bypass-via-unverified-signature-portswigger-4ca9104ff805"
            },
            {
                id: 10,
                title: "IronHold — TryHackMe",
                tags: ["THM", "Writeup"],
                date: "2026-09-29",
                link: "https://medium.com/@fuadh6565/ironhold-tryhackme-0406efa4f61d"
            }
        ];

        const blogsPerPage = 5;
        const tags = [...new Set(blogs.flatMap(blog => blog.tags))];
        let currentPage = 1;
        let currentTag = 'all';
        let sortAscending = false;
        const byNewest = (a, b) => Date.parse(b.date) - Date.parse(a.date) || b.id - a.id;
        // Compute globally, so filtering never labels an older article as NEW.
        const latestBlog = [...blogs].sort(byNewest)[0];
        const container = document.getElementById('blogContainer');

        function element(tag, className, text) {
            const node = document.createElement(tag);
            node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function readUrl() {
            const params = new URLSearchParams(window.location.search);
            currentTag = tags.includes(params.get('tag')) ? params.get('tag') : 'all';
            const page = Number(params.get('page'));
            currentPage = Number.isSafeInteger(page) && page > 0 ? page : 1;
            sortAscending = params.get('sort') === 'asc';
        }

        function writeUrl(replace = false) {
            const url = new URL(window.location.href);
            currentTag === 'all' ? url.searchParams.delete('tag') : url.searchParams.set('tag', currentTag);
            currentPage === 1 ? url.searchParams.delete('page') : url.searchParams.set('page', String(currentPage));
            sortAscending ? url.searchParams.set('sort', 'asc') : url.searchParams.delete('sort');
            if (url.href !== window.location.href) {
                history[replace ? 'replaceState' : 'pushState'](null, '', url.href);
            }
        }

        function renderBlogs() {
            const filtered = blogs.filter(blog => currentTag === 'all' || blog.tags.includes(currentTag));
            filtered.sort((a, b) => sortAscending ? -byNewest(a, b) : byNewest(a, b));
            const totalPages = Math.max(1, Math.ceil(filtered.length / blogsPerPage));
            currentPage = Math.max(1, Math.min(currentPage, totalPages));
            container.replaceChildren();
            filtered.slice((currentPage - 1) * blogsPerPage, currentPage * blogsPerPage).forEach(blog => {
                const isLatest = blog.id === latestBlog?.id;
                const row = element('article', 'blog-row animate-fade-in' + (isLatest ? ' is-latest' : ''));
                row.id = 'post-' + blog.id;
                const info = element('div', 'blog-info');
                const titleLine = element('div', 'blog-title-line');
                titleLine.append(element('span', 'blog-title', blog.title));
                if (isLatest) {
                    const badge = element('span', 'blog-new-badge', 'NEW');
                    badge.title = 'Latest published article';
                    titleLine.append(badge);
                }
                const meta = element('div', 'blog-meta');
                blog.tags.forEach(tag => meta.append(element('span', 'blog-tag-badge', tag)));
                const date = element('time', '', blog.date.slice(0, 10));
                date.dateTime = blog.date;
                meta.append(date);
                info.append(titleLine, meta);
                const link = element('a', 'btn-link-style blog-read-link', 'Read More →');
                link.href = blog.link;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.setAttribute('aria-label', 'Read ' + blog.title + ' (opens in a new tab)');
                row.append(info, link);
                container.append(row);
            });
            if (!filtered.length) container.append(element('p', '', 'No logs found for this tag.'));
            document.getElementById('pageIndicator').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
            document.getElementById('sortToggle').textContent = sortAscending ? '↑ Oldest First' : '↓ Newest First';
            document.querySelectorAll('#tagFilters button').forEach(button => {
                const active = button.dataset.tag === currentTag;
                button.classList.toggle('active', active);
                button.setAttribute('aria-pressed', String(active));
            });
        }

        ['all', ...tags].forEach(tag => {
            const button = element('button', 'filter-btn', tag === 'all' ? 'All Tags' : tag);
            button.type = 'button';
            button.dataset.tag = tag;
            button.addEventListener('click', () => {
                currentTag = tag;
                currentPage = 1;
                renderBlogs();
                writeUrl();
            });
            document.getElementById('tagFilters').append(button);
        });

        document.getElementById('sortToggle').addEventListener('click', () => {
            sortAscending = !sortAscending;
            currentPage = 1;
            renderBlogs();
            writeUrl();
        });
        function changePage(direction) {
            currentPage += direction;
            renderBlogs();
            writeUrl();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        document.getElementById('prevBtn').addEventListener('click', () => changePage(-1));
        document.getElementById('nextBtn').addEventListener('click', () => changePage(1));
        window.addEventListener('popstate', () => {
            readUrl();
            renderBlogs();
        });

        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navbarLinks');
        navToggle.addEventListener('click', () => {
            navToggle.setAttribute('aria-expanded', String(navLinks.classList.toggle('open')));
        });
        navLinks.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
            navLinks.classList.remove('open');
            navToggle.setAttribute('aria-expanded', 'false');
        }));

        readUrl();
        renderBlogs();
        writeUrl(true);
    </script>
</body>
</html>
